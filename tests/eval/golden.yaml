# Phase 4 Eval golden set (update_plan.md §7.2)
#
# Each case is a topic + expectations the search/graph pipeline should satisfy.
# Scoring (see run_eval.py::score_run):
#   - keyword_recall: fraction of expected_keywords appearing in any core paper title/abstract/keywords
#   - classic-hit:   at least one expected_titles (fuzzy) present in core layer
#   - core-count-ok: len(core) within [min_core, max_core]
# A case passes when ALL enabled checks pass.
#
# Mode: offline = run against a recorded fixture (no API); online = real search (manual).

- id: transformers_attention
  topic: "Transformer attention mechanism"
  language: en
  expected_keywords: ["attention", "transformer", "self-attention"]
  min_core: 5
  max_core: 30
  notes: "Canonical NLP topic; 'Attention Is All You Need' should surface."

